<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила сервера | Syndicate RP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c0a12;
            --bg-card: #15121e;
            --bg-glass: rgba(21, 18, 30, 0.75);
            --border-color: rgba(138, 43, 226, 0.2);
            --border-hover: rgba(138, 43, 226, 0.5);
            --text-main: #ffffff;
            --text-muted: #9a94a8;
            --accent-purple: #8a2be2;
            --accent-orange: #f58220;
            --badge-warn-bg: rgba(245, 130, 32, 0.15);
            --badge-warn-border: rgba(245, 130, 32, 0.4);
            --badge-warn-text: #ffa500;
            --badge-ban-bg: rgba(235, 50, 50, 0.15);
            --badge-ban-border: rgba(235, 50, 50, 0.4);
            --badge-ban-text: #ff5555;
            --shadow-purple: rgba(138, 43, 226, 0.25);
        }

        [data-theme="light"] {
            --bg-main: #f4f2f8;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border-color: rgba(138, 43, 226, 0.15);
            --border-hover: rgba(138, 43, 226, 0.4);
            --text-main: #130f1d;
            --text-muted: #6b657b;
            --badge-warn-bg: rgba(245, 130, 32, 0.1);
            --badge-ban-bg: rgba(235, 50, 50, 0.1);
            --shadow-purple: rgba(138, 43, 226, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-purple) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.25;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: var(--bg-glass);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo-box {
            width: 42px;
            height: 42px;
            background: #000;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .brand-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 40%, var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text span {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill-btn:hover {
            border-color: var(--accent-purple);
        }

        .lang-switch {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .lang-btn.active {
            background: var(--accent-purple);
            color: #fff;
        }

        .main-content {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.12), rgba(245, 130, 32, 0.05));
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px 24px;
            margin-bottom: 24px;
            box-shadow: 0 12px 32px var(--shadow-purple);
        }

        .hero-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .stats-row {
            display: flex;
            gap: 16px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .stat-item h3 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-orange);
        }

        .stat-item p {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 16px var(--shadow-purple);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .tabs-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .tabs-nav::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            white-space: nowrap;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
            box-shadow: 0 4px 16px var(--shadow-purple);
        }

        .rules-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rule-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .rule-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .rule-num {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent-purple);
            background: rgba(138, 43, 226, 0.1);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .rule-title {
            font-size: 0.95rem;
            font-weight: 700;
            flex-grow: 1;
        }

        .rule-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid;
            white-space: nowrap;
        }

        .badge-warn {
            background: var(--badge-warn-bg);
            border-color: var(--badge-warn-border);
            color: var(--badge-warn-text);
        }

        .badge-ban {
            background: var(--badge-ban-bg);
            border-color: var(--badge-ban-border);
            color: var(--badge-ban-text);
        }

        .rule-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>

        </div>

        <div class="search-box">

            <input type="text" id="search-input" placeholder="Поиск правила, бана или наказания..." oninput="filterRules()">
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('all', this)" id="tab-all">Все правила</button>
            <button class="tab-btn" onclick="switchTab('p1', this)" id="tab-p1">1. Игровой процесс</button>
            <button class="tab-btn" onclick="switchTab('p2', this)" id="tab-p2">2. Регламент полиции</button>
            <button class="tab-btn" onclick="switchTab('p3', this)" id="tab-p3">3. Регламент медиков</button>
            <button class="tab-btn" onclick="switchTab('p4', this)" id="tab-p4">4. Суд и Общие нормы</button>

        <div class="rules-section" id="rules-container">

        </div>
    </main>

                    { cat: "p1", num: "1.8", title: "Розпалювання конфліктів / OOC в IC", desc: "Перенесення OOC конфліктів у чат гри, образи в OOC.", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "warn" },

                    { cat: "p1", num: "1.10", title: "Багоюз / Ухилення від RP", desc: "Використання багів гри, вихід із сервера під час RP ситуації.", badge: "1-й раз — Бан 1 день | 2-й раз — Бан 3 дні", type: "ban" },
                    { cat: "p1", num: "1.11", title: "Чити / Софт", desc: "Використання будь-яких сторонніх програм та читів.", badge: "Покарання: Перманентний бан", type: "ban" },

                    { cat: "p2", num: "2.1", title: "Правило Міранди", desc: "Обов'язкове зачитування прав під час затримання (використовуйте біндери).", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "warn" },
                    { cat: "p2", num: "2.2", title: "Докази (Откат)", desc: "Будь-який арешт вимагає фіксації. За відсутності откату та свідків — Суд виправдовує.", badge: "Виправдання через Суд", type: "warn" },
                    { cat: "p2", num: "2.3", title: "Застосування спецзасобів", desc: "Тайзер та кийок використовуються чітко при прямій загрозі або опорі.", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "warn" },
                    { cat: "p2", num: "2.4", title: "Перевищення повноважень", desc: "Обшук або арешт без законних підстав та причин.", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "warn" },
                    { cat: "p2", num: "2.5", title: "Поведінка поліцейського", desc: "Дотримання ввічливості, нейтралітету та презумпції невинуватості. Провокації заборонені.", badge: "Покарання: Варн", type: "warn" },

                    { cat: "p3", num: "3.1", title: "Обов'язок виїзду на виклик", desc: "Медик зобов'язаний оперативно виїжджати на виклики.", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "warn" },
                    { cat: "p3", num: "3.2", title: "NonRP Лікування", desc: "Заборонено лікування у стрибку, на бігу або під час перестрілки.", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "warn" },
                    { cat: "p3", num: "3.3", title: "Блат та відмова у допомозі", desc: "Упереджене ставлення або відмова від надання допомоги гравцеві.", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "warn" },
                    { cat: "p3", num: "3.4", title: "Використання спецсигналів", desc: "Проблискові маячки вмикаються тільки при екстреному виклику.", badge: "1-й раз — Попередження | 2-й — Варн", type: "warn" },

                    { cat: "p4", num: "4.1", title: "Відігрування /me, /do, /try", desc: "Обов'язкове використання команд відігрування при викраденні авто та обшуках.", badge: "Покарання: Варн", type: "warn" },
                    { cat: "p4", num: "4.2", title: "Зелена Зона (GreenZone)", desc: "Заборона будь-якого криміналу в Мерії, лікарнях та відділках.", badge: "1-й раз — Варн | 2-й раз — Бан 3 дні", type: "ban" },
                    { cat: "p4", num: "4.3", title: "Судовий порядок", desc: "Право на адвоката. Надання свідомо неправдивих свідчень у суді суворо карається.", badge: "Неправдиві свідчення: Бан 7 днів", type: "ban" }
                ]
            }
        };

        let currentLang = 'ru';
        let currentTab = 'all';

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
            document.getElementById('btn-ua').classList.toggle('active', lang === 'ua');
            
            const data = rulesData[lang];
            document.getElementById('lang-subtitle').innerText = data.subtitle;
            document.getElementById('hero-title').innerText = data.heroTitle;
            document.getElementById('hero-sub').innerText = data.heroSub;
            document.getElementById('stat-1').innerText = data.stat1;
            document.getElementById('stat-2').innerText = data.stat2;
            document.getElementById('stat-3').innerText = data.stat3;
            document.getElementById('search-input').placeholder = data.searchPlaceholder;

            document.getElementById('tab-all').innerText = data.tabs.all;
            document.getElementById('tab-p1').innerText = data.tabs.p1;
            document.getElementById('tab-p2').innerText = data.tabs.p2;
            document.getElementById('tab-p3').innerText = data.tabs.p3;
            document.getElementById('tab-p4').innerText = data.tabs.p4;

            renderRules();
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderRules();
        }

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') !== 'light';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('theme-text').innerText = isDark ? 'Светлая' : 'Тёмная';
        }

        function renderRules() {
            const container = document.getElementById('rules-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const items = rulesData[currentLang].items;

            container.innerHTML = '';

            const filtered = items.filter(item => {
                const matchTab = (currentTab === 'all' || item.cat === currentTab);
                const matchSearch = item.title.toLowerCase().includes(searchQuery) || 
                                    item.desc.toLowerCase().includes(searchQuery) ||
                                    item.num.toLowerCase().includes(searchQuery) ||
                                    item.badge.toLowerCase().includes(searchQuery);
                return matchTab && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">Ничего не найдено</div>`;
                return;
            }

            filtered.forEach(item => {
                const badgeClass = item.type === 'ban' ? 'badge-ban' : 'badge-warn';
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.innerHTML = `
                    <div class="rule-header">
                        <span class="rule-num">${item.num}</span>
                        <span class="rule-title">${item.title}</span>
                        <span class="rule-badge ${badgeClass}">${item.badge}</span>
                    </div>
                    <div class="rule-desc">${item.desc}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterRules() {
            renderRules();
        }

        // Initial render
        renderRules();
    </script>
</body>
</html>
