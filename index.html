            --bg-glass: rgba(21, 18, 30, 0.85);
            --border-color: rgba(138, 43, 226, 0.25);
            --border-hover: rgba(245, 130, 32, 0.5);
            --text-main: #ffffff;
            --text-muted: #9a94a8;
            --accent-purple: #8a2be2;
            --accent-orange: #f58220;
            --badge-warn-bg: rgba(245, 130, 32, 0.15);
            --badge-warn-border: rgba(245, 130, 32, 0.4);
            --badge-warn-text: #ffa500;
            --badge-ban-bg: rgba(235, 50, 50, 0.15);
            --badge-ban-border: rgba(235, 50, 50, 0.4);
            --badge-ban-text: #ff5555;
            --shadow-purple: rgba(138, 43, 226, 0.25);
        }

        [data-theme="light"] {
            --bg-main: #f4f2f8;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --border-color: rgba(138, 43, 226, 0.15);
            --border-hover: rgba(245, 130, 32, 0.5);
            --text-main: #130f1d;
            --text-muted: #6b657b;
            --badge-warn-bg: rgba(245, 130, 32, 0.1);
            --badge-ban-bg: rgba(235, 50, 50, 0.1);
            --shadow-purple: rgba(138, 43, 226, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-purple) 0%, rgba(0,0,0,0) 70%);
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.2;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: var(--bg-glass);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo-box {
            width: 44px;
            height: 44px;
            background: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent-orange);
            overflow: hidden;
            box-shadow: 0 0 10px rgba(245, 130, 32, 0.3);
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 40%, var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text span {
            font-size: 0.65rem;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tg-btn {
            background: linear-gradient(135deg, #0088cc, #00a0e9);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        .pill-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-switch {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .lang-btn.active {
            background: var(--accent-purple);
            color: #fff;
        }

        .main-content {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.15), rgba(245, 130, 32, 0.08));
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 32px var(--shadow-purple);
        }

        .hero-title {
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }

            background: rgba(138, 43, 226, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .admin-link {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 800;
            background: rgba(245, 130, 32, 0.15);
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid rgba(245, 130, 32, 0.3);
        }

        .search-box {
            position: relative;
            margin-bottom: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 16px var(--shadow-purple);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .tabs-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .tabs-nav::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            white-space: nowrap;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;

        .tab-btn.active {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
            box-shadow: 0 4px 16px var(--shadow-purple);
        }

        .rules-section {
            display: flex;
            flex-direction: column;
            gap: 12px;

        .rule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;

        .rule-title-box {

            align-items: center;
            gap: 8px;
            flex-grow: 1;

        .rule-icon {

            font-weight: 700;

            font-weight: 700;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid;
            white-space: nowrap;

            background: var(--badge-warn-bg);
            border-color: var(--badge-warn-border);
            color: var(--badge-warn-text);
        }

        .badge-ban {
            background: var(--badge-ban-bg);
            border-color: var(--badge-ban-border);
            color: var(--badge-ban-text);
        }

            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.45;

</head>

        let currentLang = 'ru';
        let currentTab = 'all';

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
            document.getElementById('btn-ua').classList.toggle('active', lang === 'ua');
            
            const data = rulesData[lang];
            document.getElementById('lang-subtitle').innerText = data.subtitle;
            document.getElementById('hero-title').innerText = data.heroTitle;
            document.getElementById('hero-sub').innerText = data.heroSub;
            document.getElementById('search-input').placeholder = data.searchPlaceholder;

            document.getElementById('tab-all').innerText = data.tabs.all;
            document.getElementById('tab-p1').innerText = data.tabs.p1;
            document.getElementById('tab-p2').innerText = data.tabs.p2;
            document.getElementById('tab-p3').innerText = data.tabs.p3;
            document.getElementById('tab-p4').innerText = data.tabs.p4;

            renderRules();
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderRules();
        }

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') !== 'light';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('theme-text').innerText = isDark ? 'Светлая' : 'Тёмная';
        }

        function renderRules() {
            const container = document.getElementById('rules-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const items = rulesData[currentLang].items;

            container.innerHTML = '';

            const filtered = items.filter(item => {
                const matchTab = (currentTab === 'all' || item.cat === currentTab);
                const matchSearch = item.title.toLowerCase().includes(searchQuery) || 
                                    item.desc.toLowerCase().includes(searchQuery) ||
                                    item.num.toLowerCase().includes(searchQuery) ||
                                    item.badge.toLowerCase().includes(searchQuery);
                return matchTab && matchSearch;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">Ничего не найдено</div>`;
                return;
            }

            filtered.forEach(item => {
                const badgeClass = item.type === 'ban' ? 'badge-ban' : 'badge-warn';
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.innerHTML = `
                    <div class="rule-header">
                        <div class="rule-title-box">
                            <span class="rule-icon">${item.icon}</span>
                            <span class="rule-num">${item.num}</span>
                            <span class="rule-title">${item.title}</span>
                        </div>
                        <span class="rule-badge ${badgeClass}">${item.badge}</span>
                    </div>
                    <div class="rule-desc">${item.desc}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterRules() {
            renderRules();
        }

        renderRules();
    </script>
